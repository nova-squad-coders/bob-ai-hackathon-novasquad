<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks — CampusOS</title>
  <link rel="stylesheet" href="../css/tokens.css?v=5" />
  <link rel="stylesheet" href="../css/base.css?v=5" />
  <link rel="stylesheet" href="../css/components.css?v=5" />
  <link rel="stylesheet" href="../css/page.css?v=5" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar" aria-label="Module navigation"></aside>

    <div class="app-main">
      <header class="topbar" id="app-topbar"></header>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Tasks</h1>
            <p class="page-header__subtitle" id="task-count">0 tasks</p>
          </div>
          <button class="btn btn--primary" id="task-add-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            New task
          </button>
        </div>

        <div class="tabs" style="margin-bottom:var(--space-5);width:fit-content;">
          <button class="tab" data-view="today">Today</button>
          <button class="tab" data-view="upcoming">Upcoming</button>
          <button class="tab" data-view="overdue">Overdue</button>
          <button class="tab" data-view="completed">Completed</button>
          <button class="tab is-active" data-view="all">All</button>
        </div>

        <div class="toolbar">
          <div class="toolbar__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="task-search" placeholder="Search tasks…" />
          </div>
          <select class="filter-select" id="task-filter-category"></select>
          <select class="filter-select" id="task-filter-priority">
            <option value="all">All priorities</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
          <select class="filter-select" id="task-sort">
            <option value="dueDate">Sort: Due date</option>
            <option value="priority">Sort: Priority</option>
            <option value="created">Sort: Recently added</option>
          </select>
          <button class="btn btn--ghost" id="task-reset-filters">Reset</button>
        </div>

        <div class="list" id="task-list"></div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/tasks/index.js?v=5"></script>
</body>
</html>

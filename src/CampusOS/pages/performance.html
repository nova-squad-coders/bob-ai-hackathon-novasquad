<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance — CampusOS</title>
  <link rel="stylesheet" href="../css/tokens.css?v=5" />
  <link rel="stylesheet" href="../css/base.css?v=5" />
  <link rel="stylesheet" href="../css/components.css?v=5" />
  <link rel="stylesheet" href="../css/page.css?v=5" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar" aria-label="Module navigation"></aside>

    <div class="app-main">
      <header class="topbar" id="app-topbar"></header>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">Performance</h1>
            <p class="page-header__subtitle">How you're actually doing, by subject.</p>
          </div>
          <button class="btn btn--primary" id="perf-add-btn">+ Log a result</button>
        </div>

        <div id="perf-summary"></div>
        <div id="perf-chart" style="margin-bottom:var(--space-6);"></div>
        <div id="perf-list"></div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/performance/index.js?v=5"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>People — CampusOS</title>
  <link rel="stylesheet" href="../css/tokens.css?v=5" />
  <link rel="stylesheet" href="../css/base.css?v=5" />
  <link rel="stylesheet" href="../css/components.css?v=5" />
  <link rel="stylesheet" href="../css/page.css?v=5" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar" aria-label="Module navigation"></aside>

    <div class="app-main">
      <header class="topbar" id="app-topbar"></header>

      <main class="page-content">
        <div class="page-header">
          <div>
            <h1 class="page-header__title">People</h1>
            <p class="page-header__subtitle">Professors, classmates, seniors — organised your way.</p>
          </div>
          <button class="btn btn--primary" id="people-add-btn">+ New contact</button>
        </div>

        <div class="toolbar">
          <div class="toolbar__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input type="search" id="people-search" placeholder="Search contacts…" />
          </div>
          <select class="filter-select" id="people-filter-category"></select>
          <button class="btn btn--ghost" id="people-add-category-btn">+ Category</button>
        </div>

        <div class="grid" id="people-grid"></div>
      </main>
    </div>
  </div>

  <script type="module" src="../js/people/index.js?v=5"></script>
</body>
</html>

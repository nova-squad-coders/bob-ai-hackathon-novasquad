submission:
  title: "CampusOS Copilot"

  problem_statement: >
    Students manage academic performance, attendance, tasks, and personal
    finances across separate workflows, making it difficult to understand
    their overall situation and make personalized day-to-day decisions.

  solution_summary: >
    CampusOS Copilot is a context-aware AI assistant integrated into CampusOS.
    It reads relevant student data from the application's local data layer
    and uses Gemini to provide personalized insights and recommendations
    without directly modifying the student's data.

  key_features:
    - "Context-aware AI recommendations based on student data"
    - "Attendance insights and class decision support"
    - "Task prioritization and daily focus recommendations"
    - "Financial guidance based on personal spending data"
    - "Academic performance analysis with persistent Copilot chat"

  tech_stack:
    languages:
      - "HTML"
      - "CSS"
      - "JavaScript"
    frameworks: []
    ibm_technologies:
      - "IBM Bob"
    databases:
      - "IndexedDB"
    other:
      - "Google Gemini API"
      - "GitHub Actions"
      - "GitHub"

  what_we_are_most_proud_of: >
    We are most proud of turning CampusOS from a collection of student
    productivity tools into a context-aware AI assistant that can reason
    over relevant student data and provide personalized recommendations
    through a polished, responsive interface.

  known_limitations: >
    The current version is primarily a local-first application. Gemini API
    access is configured for local development rather than a production
    backend, and the application has not been designed as a production
    multi-user deployment.

